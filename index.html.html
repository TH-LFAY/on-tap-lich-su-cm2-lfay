ontestation du pouvoir", "Les guerres suppriment immédiatement la monarchie", "Les mauvaises récoltes rendent tous les ordres égaux dès mai", "Les crises renforcent définitivement l’ordre ancien"], "answer": 0}]], "fills": [{"title": "Texte 1 — La France avant 1789", "body": "À la veille de la Révolution, la France est une (1) ______ absolue de droit (2) ______. Le roi (3) ______ XVI tient son pouvoir de Dieu. La société est partagée en trois (4) ______ : le (5) ______, la (6) ______ et le (7) ______ État. Les deux premiers groupes bénéficient de (8) ______. Le Tiers État paie l’essentiel des (9) ______. Les guerres ont rendu l’État très (10) ______. Les mauvaises (11) ______ entraînent une hausse du prix du (12) ______. Pour faire face à ces crises, le roi convoque les (13) ______ généraux le (14) ______ mai 1789. Les demandes et les plaintes sont réunies dans des cahiers de (15) ______.", "answers": ["monarchie", "divin", "Louis", "ordres", "clergé", "noblesse", "Tiers", "privilèges", "impôts", "endetté", "récoltes", "pain", "États", "5", "doléances"]}, {"title": "Texte 2 — L’année 1789", "body": "Le Tiers État réclame le vote par (1) ______, refusé par les ordres privilégiés. Le (2) ______ juin 1789, ses députés se proclament (3) ______ nationale. Le 20 juin, ils prêtent le serment du (4) ______ de paume : ils promettent de donner une (5) ______ à la France. Le (6) ______ juillet, le peuple parisien prend la (7) ______, symbole du pouvoir (8) ______ du roi. La révolte gagne les campagnes : c’est la (9) ______ Peur. Dans la nuit du 4 au 5 (10) ______, l’Assemblée abolit les (11) ______. Le 26 août, elle adopte la (12) ______ des droits de l’homme et du citoyen, qui proclame la (13) ______ et l’égalité devant la (14) ______.", "answers": ["tête", "17", "Assemblée", "Jeu", "Constitution", "14", "Bastille", "absolu", "Grande", "août", "privilèges", "Déclaration", "liberté", "loi"]}, {"title": "Texte 3 — Les changements de 1789 à 1791", "body": "En octobre (1) ______, des milliers de (2) ______ marchent vers (3) ______ pour demander du pain et du travail. Le roi et sa famille sont conduits à (4) ______, au palais des (5) ______. Le (6) ______ septembre 1791, la France adopte une (7) ______ : elle devient une monarchie (8) ______. Le roi doit désormais respecter des règles organisant les (9) ______. Il partage le pouvoir avec l’Assemblée (10) ______, peut nommer des (11) ______ et dispose d’un droit de (12) ______. Toutefois, les femmes, les enfants et les citoyens (13) ______ ne participent pas au vote. Sur la grande frise, la Première République commence en (14) ______ et le Premier Empire en (15) ______.", "answers": ["1789", "femmes", "Versailles", "Paris", "Tuileries", "3", "Constitution", "constitutionnelle", "pouvoirs", "législative", "ministres", "veto", "passifs", "1792", "1804"]}]};const names=['Évaluation 1','Évaluation 2','Évaluation 3','Texte à trous 1','Texte à trous 2','Texte à trous 3'];let active=0;const state=Array.from({length:6},(_,i)=>({values:Array(i<3?30:DATA.fills[i-3].answers.length).fill(''),done:false}));
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const norm=s=>String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]/g,'').trim();
function tabs(){document.getElementById('tabs').innerHTML=names.map((n,i)=>`<button class="tab ${i===active?'active':''}" onclick="switchTo(${i})">${n}</button>`).join('')}
function switchTo(i){active=i;tabs();render();scrollTo({top:0,behavior:'smooth'})}
function setVal(i,v){state[active].values[i]=v;if(state[active].done)state[active].done=false;document.getElementById('progress').textContent=progress()}
function progress(){return `${state[active].values.filter(v=>v!==''&&v!=null).length} / ${state[active].values.length} réponses`}
function render(){const s=state[active], quiz=active<3;let out=`<h2>${esc(names[active])}${quiz?' — '+['Connaissances essentielles','Comprendre les événements','Réinvestir et raisonner'][active]:''}</h2><p class="meta">${quiz?'30 questions · Une seule bonne réponse par question · 1 point par réponse correcte':'Complète chaque espace avec le mot ou la date qui convient.'}</p><div class="progress" id="progress">${progress()}</div>`;
if(quiz){DATA.quizzes[active].forEach((q,i)=>{out+=`<article class="question"><h3>${i+1}. ${esc(q.q)}</h3><div class="opts">`;q.options.forEach((o,j)=>{let checked=s.values[i]===String(j),cl=s.done?(j===q.answer?'right':checked?'wrong':''):'';out+=`<label class="opt ${cl}"><input type="radio" name="q${i}" value="${j}" ${checked?'checked':''} onchange="setVal(${i},this.value)"><span><b>${'ABCD'[j]}.</b> ${esc(o)}</span></label>`});out+='</div>';if(s.done)out+=`<p class="feedback">${s.values[i]===String(q.answer)?'✓ Bonne réponse.':'✗ Réponse correcte :'} <b>${'ABCD'[q.answer]}. ${esc(q.options[q.answer])}</b></p>`;out+='</article>'})}
else{const f=DATA.fills[active-3];let idx=0;const content=esc(f.body).replace(/\((\d+)\) ______/g,(_,n)=>{let i=Number(n)-1;idx++;let val=s.values[i]||'',good=norm(val)===norm(f.answers[i]);return `<span class="num">(${n})</span><input aria-label="Réponse ${n}" value="${esc(val)}" class="${s.done?(good?'good':'bad'):''}" oninput="setVal(${i},this.value)" autocomplete="off">${s.done&&!good?` <small style="color:#b14743">(${esc(f.answers[i])})</small>`:''}`});out+=`<div class="fillbody">${content}</div><p class="note">${idx} mots ou dates à compléter. Les accents, majuscules et espaces n'influencent pas la note.</p>`}
if(s.done){const answers=quiz?DATA.quizzes[active].map(q=>String(q.answer)):DATA.fills[active-3].answers;const n=answers.filter((v,i)=>quiz?s.values[i]===v:norm(s.values[i])===norm(v)).length;out+=`<div class="score" role="status">Résultat : ${n} / ${answers.length} — ${Math.round(n/answers.length*100)} %</div>`}out+=`<div class="actions"><button class="btn primary" onclick="grade()">Corriger et noter</button><button class="btn" onclick="resetExam()">Recommencer</button><button class="btn" onclick="window.print()">Imprimer</button></div><p class="note">Tu peux modifier tes réponses, puis cliquer à nouveau sur « Corriger et noter ».</p>`;document.getElementById('main').innerHTML=out}
function grade(){state[active].done=true;render();document.querySelector('.score')?.scrollIntoView({behavior:'smooth',block:'center'})}
function resetExam(){if(!confirm('Effacer toutes les réponses de cet exercice ?'))return;state[active].values.fill('');state[active].done=false;render();scrollTo({top:0,behavior:'smooth'})}tabs();render();
</script></body></html>
